name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - name: Package source archive and checksum
        run: |
          git archive --format=zip --prefix="pixelclean-local-${GITHUB_REF_NAME}/" "${GITHUB_REF_NAME}" -o "pixelclean-local-${GITHUB_REF_NAME}.zip"
          sha256sum "pixelclean-local-${GITHUB_REF_NAME}.zip" > "pixelclean-local-${GITHUB_REF_NAME}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            pixelclean-local-${{ github.ref_name }}.zip
            pixelclean-local-${{ github.ref_name }}.zip.sha256
