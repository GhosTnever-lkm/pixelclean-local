<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="t d">
<title id="t">PixelClean Local demonstration preview</title><desc id="d">A browser-only interface queues a local JPEG, cleans metadata and offers a separate file download.</desc>
<rect width="1120" height="700" rx="24" fill="#0b1115"/><rect x="28" y="28" width="1064" height="644" rx="20" fill="#121b20" stroke="#2b3b40"/>
<text x="72" y="82" fill="#a9ed79" font-family="Arial,sans-serif" font-size="16" font-weight="700">◈ PIXELCLEAN <tspan fill="#79dfc3" font-size="10">LOCAL</tspan></text><text x="72" y="145" fill="#edf4f1" font-family="Arial,sans-serif" font-size="37" font-weight="700">Share the image.</text><text x="72" y="190" fill="#a9ed79" font-family="Arial,sans-serif" font-size="37" font-weight="700">Not its hidden metadata.</text><text x="72" y="227" fill="#9aadaa" font-family="Arial,sans-serif" font-size="16">Re-encode JPEG and PNG images in this browser. No upload, no server.</text>
<rect x="70" y="270" width="640" height="337" rx="17" fill="#151f24" stroke="#2b3b40"/><text x="101" y="311" fill="#edf4f1" font-family="Arial,sans-serif" font-size="17" font-weight="700">01  Choose images</text><rect x="100" y="338" width="580" height="120" rx="13" fill="#0e1719" stroke="#527263" stroke-dasharray="6 5"/><text x="390" y="383" fill="#a9ed79" font-family="Arial,sans-serif" font-size="26" text-anchor="middle">↑</text><text x="390" y="414" fill="#dbe8e2" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">Drop images here or browse files</text><text x="390" y="438" fill="#9aadaa" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">Only JPEG and PNG · files stay in your browser</text>
<rect x="100" y="478" width="580" height="55" rx="11" fill="#162125" stroke="#2e3f40"/><rect x="114" y="490" width="38" height="31" rx="8" fill="#26382d"/><text x="133" y="510" fill="#a9ed79" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">JPG</text><text x="166" y="501" fill="#edf4f1" font-family="Arial,sans-serif" font-size="12">vacation-photo.jpg</text><text x="166" y="519" fill="#9aadaa" font-family="Arial,sans-serif" font-size="10">2.4 MiB → 1.8 MiB · metadata not copied</text><rect x="100" y="550" width="410" height="41" rx="10" fill="#a9ed79"/><text x="305" y="576" fill="#102016" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Clean metadata</text><rect x="740" y="270" width="309" height="337" rx="17" fill="#151f24" stroke="#2b3b40"/><text x="772" y="311" fill="#edf4f1" font-family="Arial,sans-serif" font-size="17" font-weight="700">02  What changes</text><text x="772" y="367" fill="#79dfc3" font-family="Arial,sans-serif" font-size="15">◉</text><text x="803" y="365" fill="#edf4f1" font-family="Arial,sans-serif" font-size="13" font-weight="700">Private by design</text><text x="803" y="388" fill="#9aadaa" font-family="Arial,sans-serif" font-size="12">No upload or network requests.</text><text x="803" y="407" fill="#9aadaa" font-family="Arial,sans-serif" font-size="12">Pixels stay in this tab.</text><text x="772" y="450" fill="#79dfc3" font-family="Arial,sans-serif" font-size="15">⌖</text><text x="803" y="448" fill="#edf4f1" font-family="Arial,sans-serif" font-size="13" font-weight="700">Metadata is discarded</text><text x="803" y="471" fill="#9aadaa" font-family="Arial,sans-serif" font-size="12">Re-encoding does not copy EXIF,</text><text x="803" y="490" fill="#9aadaa" font-family="Arial,sans-serif" font-size="12">GPS, or embedded camera data.</text><rect x="772" y="522" width="244" height="59" rx="11" fill="#292316" stroke="#625234"/><text x="789" y="545" fill="#f7c875" font-family="Arial,sans-serif" font-size="12" font-weight="700">Review before sharing</text><text x="789" y="564" fill="#9aadaa" font-family="Arial,sans-serif" font-size="10">Re-encoding may change quality/size.</text>
<text x="72" y="642" fill="#7f908b" font-family="Arial,sans-serif" font-size="12">LOCAL ONLY · Originals are never modified · JPEG and PNG supported</text></svg>
